name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Show toolchain
        run: xcodebuild -version

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          SIMULATOR_UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 17 Pro/ {print $2; exit}')
          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(xcrun simctl create \
              'CI iPhone 17 Pro' \
              'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro' \
              'com.apple.CoreSimulator.SimRuntime.iOS-26-5')
          fi
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Chat_Buddy_iOS.xcodeproj \
            -scheme Chat_Buddy_iOS \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:Chat_Buddy_iOSTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-"

      # Keychain 在未签名的 app 里一律返回 -34018 (errSecMissingEntitlement):
      # entitlement 来自签名,不签名就没有。模拟器用 ad-hoc identity "-" 即可,
      # 不需要开发者证书或描述文件,CI 上可用。
      - name: Collect crash reports
        if: always()
        run: |
          set +e
          echo "=== DiagnosticReports ==="
          ls -1t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -30
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -12); do
            echo "----- $f -----"
            cat "$f"
          done
